services:
  web:
    build: .
    ports:
      - "${POS_PORT:-5000}:5000"
    volumes:
      - db-data:/data
    environment:
      - ADMIN_CODE=${ADMIN_CODE:?Set ADMIN_CODE in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=${POS_TIMEZONE:-America/Chicago}
    restart: unless-stopped

volumes:
  db-data:
    # Fixed name so sales data stays attached if the project folder is renamed
    name: church-pos-data
