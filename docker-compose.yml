# The project name keeps this stack, its containers and its volume apart from
# a Church POS install on the same machine
name: sale-pos

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=pos
      - POSTGRES_DB=pos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${POS_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pos:${POSTGRES_PASSWORD}@db:5432/pos
      - ADMIN_CODE=${ADMIN_CODE:?Set ADMIN_CODE in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - POS_TIMEZONE=${POS_TIMEZONE:-America/Chicago}
    restart: unless-stopped

volumes:
  pg-data:
    # Fixed name so sales data stays attached if the project folder is renamed
    name: sale-pos-data
